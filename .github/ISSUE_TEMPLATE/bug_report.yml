name: Bug report
description: Something in an agent, command, skill, or doc is wrong or doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** use this for security issues — see SECURITY.md.
  - type: input
    id: area
    attributes:
      label: Affected file or area
      placeholder: e.g. claude-user/agents/code-quality.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: Claude Code version / environment
