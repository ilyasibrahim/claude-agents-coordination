name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Structure & drive-by guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject unsolicited agent-manifest files at the repo root
        run: |
          set -euo pipefail
          status=0
          for f in agent.yaml agent.yml SOUL.md AGENTS.md DUTIES.md RULES.md; do
            if [ -e "$f" ]; then
              echo "::error file=$f::Root-level '$f' is not part of this project. Unsolicited agent-manifest/standard files are not accepted — see CONTRIBUTING.md. (If you are adopting GitAgent/OpenGAP deliberately, update this workflow in the same PR.)"
              status=1
            fi
          done
          exit $status

      - name: Scan files added by this PR for promotional / registry solicitation
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          added="$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" || true)"
          if [ -z "$added" ]; then
            echo "No added files to scan."
            exit 0
          fi
          status=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -nEi 'registry\.gitagent\.sh|a star helps more maintainers|gap-?promoter' "$f" >/dev/null; then
              echo "::error file=$f::Added file contains promotional / registry-onboarding content — see CONTRIBUTING.md (Automated, promotional, and unsolicited-manifest PRs)."
              status=1
            fi
          done <<EOF
$added
EOF
          exit $status

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: markdownlint
        continue-on-error: true
        run: npx --yes markdownlint-cli2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: yamllint
        continue-on-error: true
        run: |
          python -m pip install --quiet yamllint
          python -m yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" .

      - name: Link check
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 4 "./**/*.md"
          fail: false
